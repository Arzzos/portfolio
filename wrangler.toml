# R2 object-store bucket for heavy assets (screenshots, video, CV pdf).
# Bound in a later step with: wrangler r2 bucket create arzzos-portfolio-assets
# [[r2_buckets]]
# binding = "ASSETS"
# bucket_name = "arzzos-portfolio-assets"

name = "arzzos-portfolio"
main = "./worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Required: without it, asset-matching requests bypass the Worker entirely and
# security headers set in worker.js would never apply (default is asset-first).
run_worker_first = true

[vars]
SITE_URL = "https://arzzos.com"
CONTACT_TO = "hola@arzzos.com"
CONTACT_FROM = "hola@arzzos.com"
# Public Turnstile site key (visible in HTML by design).
TURNSTILE_SITE_KEY = "0x4AAAAAAFSdRj1UQdP8paSq"
# Frontend hostnames accepted by siteverify. Prod only: never localhost here.
TURNSTILE_HOSTNAMES = "arzzos.com,www.arzzos.com"
